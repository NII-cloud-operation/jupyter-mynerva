name: Release

on:
  push:
    tags: '*'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    uses: ./.github/workflows/build.yml

  draft_release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        name: extension-artifacts
        path: dist
    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        previous_tag=$(gh release view --json tagName --jq .tagName)
        gh release create "$RELEASE_TAG" --verify-tag --draft \
          --title "$RELEASE_TAG" --generate-notes --notes-start-tag "$previous_tag" dist/*

  publish-pypi:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.repository == 'NII-cloud-operation/jupyter-mynerva' && 'pypi' || 'testpypi' }}
      url: ${{ github.repository == 'NII-cloud-operation/jupyter-mynerva' && 'https://pypi.org/project/jupyter-mynerva/' || 'https://test.pypi.org/project/jupyter-mynerva/' }}
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Download tested Python packages
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        gh release download "$RELEASE_TAG" --pattern '*.whl' --pattern '*.tar.gz' --dir dist

    - name: Publish Python packages
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: ${{ github.repository == 'NII-cloud-operation/jupyter-mynerva' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
