name: Build

on:
  push:
    branches: main
  pull_request:
    branches: '*'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - uses: ./.github/actions/test-dependencies

    - name: Install dependencies
      run: python -m pip install -U "jupyterlab>=4.0.0,<5"

    - name: Check release version
      if: startsWith(github.ref, 'refs/tags/')
      shell: python
      run: |
        import json
        import os
        from pathlib import Path
        from packaging.version import Version
        version = json.loads(Path('package.json').read_text())['version']
        assert Version(os.environ['GITHUB_REF_NAME']) == Version(version), 'Tag and package version must match'

    - name: Lint the extension
      run: |
        set -eux
        jlpm
        jlpm run lint:check

    - name: Build the extension
      run: |
        set -eux
        python -m pip install .[test]

        jupyter server extension list
        jupyter server extension list 2>&1 | grep -ie "jupyter_mynerva.*OK"

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "jupyter-mynerva.*OK"
        python -m jupyterlab.browser_check

    - name: Run tests
      run: python -m pytest tests/ -v

    - name: Package the extension
      run: |
        set -eux

        pip install build twine
        python -m build
        python -m twine check --strict dist/*
        pip uninstall -y "jupyter_mynerva" jupyterlab

    - name: Upload extension packages
      uses: actions/upload-artifact@v7
      with:
        name: extension-artifacts
        path: dist/*
        if-no-files-found: error

  ui_tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Base Setup
      uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

    - uses: ./.github/actions/test-dependencies

    - name: Install dependencies
      run: python -m pip install -U "jupyterlab>=4.0.0,<5"

    - uses: actions/download-artifact@v8
      with:
        name: extension-artifacts
        path: dist

    - name: Install the extension
      run: |
        python -m pip install dist/jupyter_mynerva*.whl
        python -m pip check
        nblibram version

    - name: Install Galata
      working-directory: ui-tests
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      run: jlpm install

    - name: Install browser
      working-directory: ui-tests
      run: jlpm playwright install chromium

    - name: Integration tests
      working-directory: ui-tests
      run: jlpm test

    - name: Upload UI test artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ui-test-output
        path: ui-tests/test-results
        if-no-files-found: ignore

  test_isolated:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        path: source
    - name: Install Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        architecture: 'x64'
    - uses: ./source/.github/actions/test-dependencies
    - uses: actions/download-artifact@v8
      with:
        name: extension-artifacts
    - name: Install and Test
      run: |
        set -eux
        # Remove NodeJS, twice to take care of system and locally installed node versions.
        sudo rm -rf $(which node)
        sudo rm -rf $(which node)

        pip install "jupyterlab>=4.0.0,<5" jupyter_mynerva*.whl
        python -m pip check
        nblibram version

        jupyter server extension list
        jupyter server extension list 2>&1 | grep -ie "jupyter_mynerva.*OK"

        jupyter labextension list
        jupyter labextension list 2>&1 | grep -ie "jupyter-mynerva.*OK"
        python -m jupyterlab.browser_check --no-browser-test


  check_links:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@v1
